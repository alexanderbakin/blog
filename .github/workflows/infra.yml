# Infrastructure Pipeline (Terraform)
#
# Triggered on changes to terraform/. Follows the industry-standard pattern:
# - PR open → terraform plan (posted as comment)
# - PR merge → terraform apply

name: Infrastructure

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/infra.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: write # So we can post plan results as PR comments

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.9.0"
  TF_WORKING_DIR: terraform
  TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
  TF_VAR_create_route53_zone: true
  TF_VAR_create_github_actions_role: true
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
  TF_VAR_github_repo: ${{ github.repository }}
  # GitHub's OIDC sub claim now uses numeric IDs: owner@OWNERID/repo@REPOID
  # IDs are immutable, so they're safe to hardcode here.
  TF_VAR_github_repo_id_format: "alexanderbakin@242987075/blog@1338101538"

jobs:
  # Plan (runs on both PR and push)
  plan:
    name: terraform plan
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Generate main.tf
        run: |
          if [ -f terraform/main.tf.template ] && [ ! -f terraform/main.tf ]; then
            sed "s/ACCOUNTID/${{ secrets.AWS_ACCOUNT_ID }}/g" terraform/main.tf.template > terraform/main.tf
          fi

      - name: Terraform Init
        id: init
        run: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}

      # Upload the plan so the apply job can reuse it
      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 1

      # Post plan output as a PR comment
      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          # Passed via env, not interpolated into the script string: the plan
          # output is attacker-influenceable (any PR touching terraform/**
          # controls resource names/tags that land in it), and splicing
          # `${{ }}` directly into a JS template literal lets a crafted
          # string break out and run arbitrary code in this step — which
          # still has the OIDC-assumed Terraform role's AWS credentials
          # live in its environment.
          PLAN_OUTPUT: ${{ steps.plan.outputs.stdout }}
          PLAN_STATUS: ${{ steps.plan.outcome }}
          VALIDATE_STATUS: ${{ steps.validate.outcome }}
        with:
          script: |
            const planOutput = process.env.PLAN_OUTPUT;
            const planStatus = process.env.PLAN_STATUS;
            const validateStatus = process.env.VALIDATE_STATUS;

            // Truncate if too long (GitHub has a 65535 char limit)
            const body = planOutput.length > 60000
              ? planOutput.substring(0, 60000) + "\n\n... *(output truncated)*"
              : planOutput;

            const issueNumber = context.issue.number;
            const commentBody = `## Terraform Plan ${planStatus === 'success' ? 'OK' : 'Failed'}
            \`\`\`diff
            ${body}
            \`\`\`
            **Validate:** ${validateStatus}
            `;

            // Find and update any existing plan comment, or create new
            const {data: comments} = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('## Terraform Plan')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: commentBody,
              });
            }

  # Apply (runs only on main branch merge)
  apply:
    name: terraform apply
    needs: [plan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-apply
      cancel-in-progress: false # Don't cancel in-progress applies

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Generate main.tf
        run: |
          if [ -f terraform/main.tf.template ] && [ ! -f terraform/main.tf ]; then
            sed "s/ACCOUNTID/${{ secrets.AWS_ACCOUNT_ID }}/g" terraform/main.tf.template > terraform/main.tf
          fi

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Init
        run: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply
        run: terraform apply -no-color -auto-approve tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}
