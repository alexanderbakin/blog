<rect x="440" y="343" width="90" height="55" rx="5" fill="#0f172a"/>
<rect x="440" y="343" width="90" height="55" rx="5" fill="rgba(6, 78, 59, 0.35)" stroke="#34d399" stroke-width="1.2"/>
<text x="485" y="375" fill="#d1fae5" font-size="8" text-anchor="middle">Hugo Build</text>

<rect x="540" y="343" width="90" height="55" rx="5" fill="#0f172a"/>
<rect x="540" y="343" width="90" height="55" rx="5" fill="rgba(6, 78, 59, 0.35)" stroke="#34d399" stroke-width="1.2"/>
<text x="585" y="375" fill="#d1fae5" font-size="8" text-anchor="middle">Sync to S3</text>

<rect x="640" y="343" width="110" height="55" rx="5" fill="#0f172a"/>
<rect x="640" y="343" width="110" height="55" rx="5" fill="rgba(6, 78, 59, 0.35)" stroke="#34d399" stroke-width="1.2"/>
