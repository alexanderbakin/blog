<rect x="580" y="198" width="110" height="55" rx="5" fill="rgba(6, 78, 59, 0.35)" stroke="#34d399" stroke-width="1.2"/>
<text x="635" y="230" fill="#d1fae5" font-size="8" text-anchor="middle">Terraform Apply</text>

<text x="520" y="278" fill="#64748b" font-size="7.5" text-anchor="middle">plan commented on PR · apply runs on merge to main</text>

