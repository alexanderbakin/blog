<text x="695" y="382" fill="#d1fae5" font-size="8" text-anchor="middle">CloudFront</text>

<text x="520" y="428" fill="#64748b" font-size="7.5" text-anchor="middle">build → two-pass S3 sync (assets vs HTML cache) → invalidate edge cache</text>

