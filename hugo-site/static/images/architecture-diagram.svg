<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 600">
<!-- Definitions -->
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
  </pattern>
  <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
  </marker>
  <marker id="arrowhead-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185" />
  </marker>
  <marker id="arrowhead-white" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#f8fafc" />
  </marker>
</defs>

<!-- Background grid -->
<rect x="0" y="0" width="1190" height="600" fill="url(#grid)"/>

<!-- =================================================================
     REGION / CLUSTER BOUNDARIES (outlines only, transparent fill)
     ================================================================= -->
<rect x="40" y="125" width="200" height="100" rx="10" fill="rgba(148, 163, 184, 0.04)" stroke="#94a3b8" stroke-width="1" stroke-dasharray="8,4"/>
<text x="56" y="145" fill="#94a3b8" font-size="10" font-weight="600">Local</text>

<rect x="260" y="125" width="530" height="340" rx="10" fill="rgba(52, 211, 153, 0.03)" stroke="#34d399" stroke-width="1" stroke-dasharray="8,4"/>
<text x="276" y="145" fill="#34d399" font-size="10" font-weight="600">GitHub Actions</text>

<rect x="280" y="160" width="490" height="125" rx="8" fill="transparent" stroke="#64748b" stroke-width="1" stroke-dasharray="4,4"/>
<text x="292" y="176" fill="#94a3b8" font-size="8">Infrastructure Pipeline · on terraform/**</text>

<rect x="280" y="305" width="490" height="145" rx="8" fill="transparent" stroke="#64748b" stroke-width="1" stroke-dasharray="4,4"/>
<text x="292" y="321" fill="#94a3b8" font-size="8">Content Deploy Pipeline · on hugo-site/**</text>

<rect x="810" y="125" width="360" height="320" rx="12" fill="rgba(251, 191, 36, 0.05)" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
<text x="822" y="145" fill="#fbbf24" font-size="10" font-weight="600">AWS Region</text>

<!-- =================================================================
     ARROWS
     ================================================================= -->

<!-- User -> Route53 (DNS lookup only) -->
<line x1="428" y1="67" x2="383" y2="67" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>

<!-- User -> CloudFront (actual HTTPS traffic, direct) -->
<path d="M 560 58 C 750 20 900 90 1028 258" fill="none" stroke="#e2e8f0" stroke-width="1.5" marker-end="url(#arrowhead-white)"/>

<!-- Developer -> Infra pipeline lane -->
<path d="M 220 168 C 245 178 265 190 278 205" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>

<!-- Developer -> Deploy pipeline lane -->
<path d="M 220 188 C 240 250 260 310 278 345" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>

<!-- Infra pipeline internal chain -->
<line x1="452" y1="225" x2="458" y2="225" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
<line x1="572" y1="225" x2="578" y2="225" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>

<!-- Deploy pipeline internal chain -->
<line x1="432" y1="370" x2="438" y2="370" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
<line x1="532" y1="370" x2="538" y2="370" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
<line x1="632" y1="370" x2="638" y2="370" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>

<!-- Terraform Apply -> AWS Region (provisions infra) -->
<path d="M 690 225 C 740 224 780 223 808 223" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>

<!-- Sync to S3 -> S3 Origin bucket (routed up and over, clear of Invalidate CloudFront) -->
<path d="M 585 341 C 660 300 760 280 818 330" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>

<!-- ACM -> CloudFront -->
<line x1="1100" y1="205" x2="1100" y2="233" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>

<!-- CloudFront -> S3 Origin (OAC auth) -->
<path d="M 1035 290 C 970 310 935 317 908 323" fill="none" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrowhead-rose)"/>

<!-- CloudFront -> CloudWatch (metrics) -->
<line x1="1100" y1="290" x2="1100" y2="323" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowhead)"/>

<!-- =================================================================
     ARROW LABEL CHIPS
     ================================================================= -->
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif">
  <rect x="378" y="59" width="34" height="15" rx="3" fill="#0f172a" opacity="0.9"/>
  <text x="395" y="70" fill="#94a3b8" font-size="7" text-anchor="middle">DNS</text>

  <rect x="598" y="6" width="54" height="15" rx="3" fill="#0f172a" opacity="0.9"/>
  <text x="625" y="17" fill="#e2e8f0" font-size="7.5" text-anchor="middle">HTTPS</text>

  <rect x="700" y="213" width="100" height="15" rx="3" fill="#0f172a" opacity="0.9"/>
  <text x="750" y="224" fill="#94a3b8" font-size="7.5" text-anchor="middle">provisions infra</text>

  <rect x="690" y="284" width="34" height="14" rx="3" fill="#0f172a" opacity="0.85"/>
  <text x="707" y="294" fill="#94a3b8" font-size="7" text-anchor="middle">sync</text>

  <rect x="945" y="300" width="60" height="14" rx="3" fill="#0f172a" opacity="0.9"/>
  <text x="975" y="310" fill="#fb7185" font-size="7" text-anchor="middle">OAC auth</text>

  <rect x="1072" y="298" width="50" height="14" rx="3" fill="#0f172a" opacity="0.85"/>
  <text x="1097" y="308" fill="#94a3b8" font-size="7" text-anchor="middle">metrics</text>
</g>

<!-- =================================================================
